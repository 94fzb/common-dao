name: Verify and release to Maven Central

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dao_test
          MYSQL_USER: dao_test
          MYSQL_PASSWORD: local-test-only
          MYSQL_ROOT_PASSWORD: local-root-test-only
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    concurrency:
      group: central-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Verify immutable release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" != *SNAPSHOT* ]]
      - name: Verify release dependencies and tests
        env:
          COMMON_DAO_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/dao_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
          COMMON_DAO_MYSQL_TEST_USER: dao_test
          COMMON_DAO_MYSQL_TEST_PASSWORD: local-test-only
        run: ./mvnw -B -ntp -Duser.timezone=Asia/Shanghai clean verify
      - name: Verify UTC date mapping
        env:
          COMMON_DAO_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/dao_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
          COMMON_DAO_MYSQL_TEST_USER: dao_test
          COMMON_DAO_MYSQL_TEST_PASSWORD: local-test-only
        run: ./mvnw -B -ntp -Duser.timezone=UTC -Dtest=EntityTemporalTest,EntityMySqlTemporalTest,EntityWebApiTest,ResultValueConvertUtilsTest test
      - name: Import signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp deploy -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
